name: lead-qualifier

# All image versions are pinned. Bump deliberately, then re-run the eval.
x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  GENERIC_TIMEZONE: UTC
  TZ: UTC

services:
  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leads}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first boot of an empty data volume (alphabetical order).
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web UI + REST API
      - "127.0.0.1:1025:1025"   # SMTP (host access, e.g. for debugging)

  # One-shot: renders credentials from .env, imports credentials + workflows
  # into n8n's database and publishes them. Only this container receives the
  # Anthropic API key; the long-running n8n container never sees it.
  n8n-init:
    image: n8nio/n8n:2.42.6
    entrypoint: ["/bin/sh", "/scripts/init-n8n.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *n8n-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-leads}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEAD_WEBHOOK_SECRET: ${LEAD_WEBHOOK_SECRET:?set LEAD_WEBHOOK_SECRET in .env}
    volumes:
      - ./scripts/init-n8n.sh:/scripts/init-n8n.sh:ro
      - ./scripts/render-credentials.js:/scripts/render-credentials.js:ro
      - ./n8n/credentials.template.json:/scripts/credentials.template.json:ro
      - ./workflows:/workflows:ro
    restart: "no"

  n8n:
    image: n8nio/n8n:2.42.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      n8n-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5679}:5678"
    environment:
      <<: *n8n-env
      N8N_HOST: localhost
      N8N_PORT: "5678"            # port inside the container; see N8N_HOST_PORT for the host side
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5679}/
      # n8n 2.x blocks $env in expressions/Code nodes by default. The workflows
      # read only the NON-secret settings below. The Anthropic key is NOT in this
      # container's environment; it lives only in an encrypted n8n credential.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # n8n 2.x restricts file nodes; allow only the read-only prompts mount.
      N8N_RESTRICT_FILE_ACCESS_TO: /data/prompts
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      # Non-secret workflow settings (read via $env in the workflows).
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      CLAUDE_MODEL: ${CLAUDE_MODEL:?set CLAUDE_MODEL in .env}
      QUALIFY_PROMPT_VERSION: ${QUALIFY_PROMPT_VERSION:-v1}
      BOOKING_LINK_URL: ${BOOKING_LINK_URL:?set BOOKING_LINK_URL in .env}
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env}
      MAIL_FROM: ${MAIL_FROM:-Acme Sales <sales@acme.test>}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./prompts:/data/prompts:ro

  # Keyless stand-in for the Anthropic API (CI + offline demos). Start with `--profile mock`
  # and set ANTHROPIC_BASE_URL=http://mock-anthropic:8080 and any non-empty ANTHROPIC_API_KEY in .env.
  mock-anthropic:
    profiles: ["mock"]
    image: python:3.13.16-alpine
    command: ["python", "/app/server.py"]
    volumes:
      - ./mock/server.py:/app/server.py:ro
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
  n8n_data:
